<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111015" />
    <meta name="description" content="Teilen, planen, abrechnen – für Familie und Freunde." />
    <title>share · Teilen, planen, abrechnen</title>

    <!-- Favicon / App-Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS: 'Zum Home-Bildschirm hinzufügen' als eigenständige App -->
    <meta name="apple-mobile-web-app-title" content="share" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link-Vorschau (Open Graph). Absolute URLs, damit WhatsApp/iMessage &
         Co. das Vorschaubild zuverlässig laden. Bei anderer Domain hier und in
         den Twitter-Tags anpassen. Bereichs-Links (/s/…) bekommen Name, Bild
         und Module von der Edge Function (netlify/shared/linkPreview.ts);
         „?v=" ist dort PREVIEW_IMAGE_VERSION. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="share" />
    <meta property="og:title" content="share" />
    <meta property="og:description" content="Teilen, planen, abrechnen – für Familie und Freunde." />
    <meta property="og:url" content="https://share.alae.app/" />
    <meta property="og:image" content="https://share.alae.app/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="share" />
    <meta property="og:locale" content="de_CH" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="share" />
    <meta name="twitter:description" content="Teilen, planen, abrechnen – für Familie und Freunde." />
    <meta name="twitter:image" content="https://share.alae.app/og-image.png?v=3" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
